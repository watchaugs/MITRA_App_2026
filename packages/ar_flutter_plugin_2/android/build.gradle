group 'com.uhg0.ar_flutter_plugin_2'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Match the APP's AGP (8.7.3) + Kotlin (2.2.20). The original 8.3.2 here
        // referenced the removed Gradle `HasConvention` API and crashed under the
        // app's Gradle 9.8.1; removing it entirely made AGP unavailable ("plugin
        // not found"). Matching the app's versions is the correct middle ground.
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    namespace 'com.uhg0.ar_flutter_plugin_2'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 28
    }
}

dependencies {
    implementation 'io.github.sceneview:arsceneview:2.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}