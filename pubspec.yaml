name: mitra_student
description: MITRA — AR Learning Platform for Indian Students. Ministry of Education, Govt. of India.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.1

  # Navigation
  go_router: ^13.2.0

  # State Management (Zustand equivalent)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP Client (Axios equivalent)
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Secure Storage (expo-secure-store equivalent)
  flutter_secure_storage: ^9.0.0

  # Local Storage (AsyncStorage equivalent)
  shared_preferences: ^2.5.5

  # SQLite (expo-sqlite equivalent)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Firebase (FCM Push Notifications)
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2

  # Network Info (react-native-community/netinfo equivalent)
  connectivity_plus: ^6.0.3

  # Camera (expo-camera equivalent)
  camera: ^0.10.5+9

  # Linear Gradient (expo-linear-gradient equivalent)
  gradient_borders: ^1.0.1

  # Internationalization (i18next equivalent)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # HTTP + JSON
  http: ^1.2.1

  # Image handling
  cached_network_image: ^3.3.1

  # UI Utilities
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shimmer: ^3.0.0

  # Animation
  lottie: ^3.5.1
  animate_do: ^3.3.4

  # Safe Area (react-native-safe-area-context equivalent)
  # Built into Flutter via SafeArea widget

  # Device Info (expo-device equivalent)
  device_info_plus: ^10.1.0

  # Package Info (expo-constants equivalent)
  package_info_plus: ^8.0.0

  # File System (expo-file-system equivalent)
  path_provider: ^2.1.6
  
  # Offline / Queue
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Fonts — Google Fonts (Baloo2, Mukta)

  # URL Launcher
  url_launcher: ^6.3.2

  # Permission Handler
  permission_handler: ^11.3.1

  # Env Variables
  flutter_dotenv: ^5.1.0
  google_sign_in: ^7.2.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  flutter_native_splash: ^2.4.7
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  uuid: ^4.5.3
  model_viewer_plus: ^1.8.0
  # Vendored (patched) copy — the pub.dev 0.0.3 ArView.kt mis-decodes node
  # rotation (no radians→degrees conversion), breaking button rotation in AR.
  # The fix lives in packages/ar_flutter_plugin_2/android/.../ArView.kt so it
  # survives clean checkouts, pub cache clean, and CI rebuilds.
  ar_flutter_plugin_2:
    path: ./packages/ar_flutter_plugin_2
  audioplayers: ^6.1.0
  vector_math: ^2.1.4
  # isar_community: maintained fork of isar 3.x with Android 16 KB page-size
  # support (required by Google Play). Same API; package names differ.
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  firebase_remote_config: ^4.3.0
  workmanager: ^0.6.0
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.9


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_tts: ^4.2.5
  isar_community_generator: ^3.4.1

flutter:
  uses-material-design: true
  # Bundled fonts (SIL Open Font License; licence texts in assets/fonts/OFL-*.txt).
  # Only the weights the app uses are shipped. Scripts these fonts don't cover
  # (Gujarati, Bengali, Tamil, Ol Chiki …) fall back to the phone's Noto fonts.
  fonts:
    - family: Courgette
      fonts:
        - asset: assets/fonts/Courgette-Regular.ttf
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700 
        

  assets:
    - assets/data/quotes.json
    - assets/data/brain_spark_facts.json
    - assets/fonts/
    - assets/images/
    - assets/animations/
    - assets/lotties/
    - assets/locales/
    - assets/ar/models/
    - assets/ar/
    - assets/ar/lib/aframe.min.js
    - assets/ar/lib/mindar-image-aframe.prod.js
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png" # Keeps iOS happy
  adaptive_icon_background: "#0B1C4B"  # 🚨 CHANGE THIS: Put your preferred background color HEX code here!
  adaptive_icon_foreground: "assets/images/logo.png" # Tells Android to stretch this to the edges
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B1C4B"
  image: "assets/images/logo_padded.png" # ✨ Point to the new padded file
  branding: "assets/images/branding.png"
  branding_mode: bottom
  
  android_12:
    color: "#0B1C4B"
    image: "assets/images/logo_padded.png" # ✨ Point to the new padded file
    branding: "assets/images/branding.png"
  ios: false