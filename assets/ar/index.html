<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MITRA AR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif; }
    #ar-container { position: absolute; inset: 0; touch-action: none; }
    #ar-container video, #ar-container canvas {
      position: absolute; inset: 0; width: 100% !important; height: 100% !important;
      object-fit: cover; }
    #hint { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 15px; z-index: 5; text-shadow: 0 1px 4px #000;
      pointer-events: none; padding: 0 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="hint" class="hidden">Point your camera at the floor</div>

  <!--
    CLASSIC script (NOT type="module"). Android WebView blocks ES modules and
    import maps when the page is loaded from a file:// asset (CORS: "requests are
    only supported for protocol schemes http, https, data…"), which is what made
    the lesson fail with "could not be shown". ar_engine.js is a self-contained
    bundle (Three.js + GLTF/DRACO loaders + the MITRA engine + gestures) built as
    a classic IIFE, so it runs offline from file:// with no imports and no CORS.
    Flutter injects window.MITRA_CONFIG and calls window.mitraStart(...).
  -->
  <script src="ar_engine.js"></script>
</body>
</html>
