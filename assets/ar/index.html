<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MITRA AR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif; }
    #ar-container { position: absolute; inset: 0; }
    /* MindAR injects the camera <video> and the three.js <canvas>; make them fill. */
    #ar-container video, #ar-container canvas {
      position: absolute; inset: 0; width: 100% !important; height: 100% !important;
      object-fit: cover; }
    #hint { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 15px; z-index: 5; text-shadow: 0 1px 4px #000;
      pointer-events: none; padding: 0 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="hint" class="hidden">Point your camera at the page</div>

  <!-- Offline-bundled engine (three.js + MindAR + GLTF + audio sync) -->
  <script src="ar_engine.js"></script>
  <!--
    No "Begin" splash any more. The camera permission is already granted on the
    Flutter side before this page loads, and the AR card tap is the user gesture
    that allows camera + audio. Flutter injects window.MITRA_CONFIG and then
    calls window.mitraStart(...) itself (see _injectConfig in
    webar_viewer_screen.dart), so the live view starts automatically with a
    single tap from the Learn card.
  -->
</body>
</html>
