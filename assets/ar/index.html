<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MITRA AR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif; }
    #ar-container { position: absolute; inset: 0; touch-action: none; }
    #ar-container video, #ar-container canvas {
      position: absolute; inset: 0; width: 100% !important; height: 100% !important;
      object-fit: cover; }
    #hint { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 15px; z-index: 5; text-shadow: 0 1px 4px #000;
      pointer-events: none; padding: 0 20px; }
    .hidden { display: none !important; }
  </style>

  <!--
    Three.js is loaded as a VERSIONED module via an import map, so MITRA's own
    code (engine.js, gestures.js) stays small and hand-editable.
    OFFLINE BUILD: download three@0.160.0 build/three.module.js and
    examples/jsm/* into assets/ar/vendor/three/ and change these URLs to
    './vendor/three/...'.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ar-container"></div>
  <div id="hint" class="hidden">Point your camera at the floor</div>

  <!-- MITRA engine (readable source). Flutter injects window.MITRA_CONFIG and
       calls window.mitraStart(...) once the page is ready. -->
  <script type="module" src="./engine.js"></script>
</body>
</html>
