// ═══════════════════════════════════════════════════════
// android/build.gradle — Project-level Gradle config
// ═══════════════════════════════════════════════════════

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Google services plugin for Firebase
        classpath "com.google.gms:google-services:4.4.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    // ✨ FIX 1: Prevent "Different Roots" Windows Crash
    // Keeps third-party plugin builds on their native drives (C:) instead of forcing them to D:
    if (project.name == "app") {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    } else {
        project.buildDir = "${project.projectDir}/build"
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// ✨ FIX 2: Crash-Proof Namespace Injection + old-plugin compileSdk + skip resource verify
subprojects {
    project.plugins.withId("com.android.library") {
        project.android {
            if (namespace == null) {
                namespace project.group
            }
            // ✨ FIX 5: Isar 3.1.0+1 (and other old plugins) were built against
            // SDK <31 and reference android:attr/lStar. Recompile them against a
            // modern SDK so the resource resolves.
            compileSdkVersion 34
        }
    }
    // ✨ FIX 6: The strict release resource-verify is what fails on those old
    // bundled resources. Disable it per plugin module via a late-bound rule
    // (projects are already evaluated here due to evaluationDependsOn above, so
    // afterEvaluate can't be used — configure the task as it is created instead).
    project.tasks.configureEach { task ->
        if (task.name == "verifyReleaseResources") {
            task.enabled = false
        }
    }
}

// ✨ FIX 3: Disable incremental compilation to fix C:/D: drive root mismatch on Windows
// ✨ FIX 4: Override Kotlin language version for old plugins (e.g. sentry_flutter 7.x)
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            incremental = false
            languageVersion = "1.9"
            apiVersion = "1.9"
        }
    }
}