// ═══════════════════════════════════════════════════════
// android/app/build.gradle — MITRA Student App
// ═══════════════════════════════════════════════════════

plugins {
    id "com.android.application"
    id "kotlin-android"
    // FlutterPlugin must come AFTER com.android.application
    id "dev.flutter.flutter-gradle-plugin"
    // Google services (Firebase) — must be LAST
    id "com.google.gms.google-services"
}

android {
    namespace "in.gov.mitra.student"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "in.gov.mitra.student"
        // Raised to 28 (Android 9): required by ar_flutter_plugin_2 for ARCore.
        // All ARCore-capable phones are well above this anyway.
        minSdkVersion 28
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Use the real release keystore when key.properties is present;
            // fall back to debug only for local dev builds without it.
            signingConfig rootProject.file("key.properties").exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            //applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Isar 3.1.0+1 ships old resources that trip verifyReleaseResources
    // ("android:attr/lStar not found"). Turning off the vital-lint/resource
    // check lets the release link; resources are fine at runtime. (Re-enable
    // for a final production audit.)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source "../.."
}

dependencies {
    // Firebase BoM — manages all Firebase library versions
    implementation platform("com.google.firebase:firebase-bom:33.0.0")
    implementation "com.google.firebase:firebase-messaging-ktx"
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ARCore SDK — needed for the ArCoreApk availability check + install prompt
    // in MainActivity (checkArCore / requestArCoreInstall). ar_flutter_plugin_2
    // uses ARCore too, but we declare it explicitly so MainActivity compiles.
    implementation "com.google.ar:core:1.42.0"
}